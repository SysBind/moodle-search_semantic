services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: p@ssw0rd
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker-pg-create-db.sh:/docker-entrypoint-initdb.d/01-create-moodle-db.sh
    ports:
      - "5433:5432"


  moodle-init-code:
    image: alpine/git
    volumes:
      - moodle_code:/var/www/html
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "if [ ! -f '/var/www/html/public/version.php' ]; then
         echo 'Checking out MDL-aiaction-embed-text from moodle....' &&
         git clone --depth 1 -b MDL-aiaction-embed-text https://github.com/SysBind/moodle /tmp/moodle &&
         cp -a /tmp/moodle/. /var/www/html/ &&
         rm -rf /tmp/moodle;
       fi"
      
  moodle:
    image: moodlehq/moodle-php-apache:8.4-bookworm
    ports:
      - "80:80"
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
    volumes:
      - moodle_code:/var/www/html
      - moodle_data:/var/www/moodledata
      - ./docker-moodle-config.php:/var/www/html/config.php
      - ./docker-php.conf:/etc/apache2/conf-available/docker-php.conf:ro
      - .:/var/www/html/public/search/engine/semantic:ro
    depends_on:
      db:
        condition: service_started
      moodle-init-code:
        condition: service_completed_successfully
    command: >
      sh -c "
      apt-get update && apt-get install -y poppler-utils &&
      if ! command -v composer >/dev/null 2>&1; then
        echo 'Composer not found. Installing Composer dynamically...' &&
        php -r \"copy('https://getcomposer.org/installer', 'composer-setup.php');\" &&
        php composer-setup.php --install-dir=/usr/local/bin --filename=composer &&
        php -r \"unlink('composer-setup.php');\";
      fi &&
      composer install --no-dev --classmap-authoritative --working-dir=/var/www/html &&
      apache2-foreground
      "

  cron:
    image: moodlehq/moodle-php-apache:8.4-bookworm
    restart: unless-stopped
    volumes:
      - moodle_code:/var/www/html
      - moodle_data:/var/www/moodledata
      - ./docker-moodle-config.php:/var/www/html/config.php
      - .:/var/www/html/public/search/engine/semantic:ro
    depends_on:
      db:
        condition: service_started
      moodle-init-code:
        condition: service_completed_successfully
      moodle:
        condition: service_started
    command: >
      sh -c "
      su -s /bin/sh www-data -c 'php /var/www/html/admin/cli/install_database.php --agree-license --adminpass=q1w2e3r4';
      while true; do
        su -s /bin/sh www-data -c 'php /var/www/html/admin/cli/cron.php --keep-alive=0'
        sleep 60
      done
      "

volumes:
  postgres_data:
  moodle_code:
  moodle_data:

