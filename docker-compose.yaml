services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: p@ssw0rd
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker-pg-create-db.sh:/docker-entrypoint-initdb.d/01-create-moodle-db.sh
    ports:
      - "5433:5432"


  moodle-init-code:
    image: alpine/git
    volumes:
      - moodle_code:/var/www/html
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "if [ ! -f '/var/www/html/public/version.php' ]; then
         echo 'Checking out MOODLE_502_STABLE from moodle....' &&
         git clone --depth 1 -b MDL-RAG-AI-ACTIONS https://github.com/SysBind/moodle /tmp/moodle &&
         cp -a /tmp/moodle /var/www/html/ &&
         rm -rf /tmp/moodle;
       fi"
      
  moodle:
    image: moodlehq/moodle-php-apache:8.4-bullseye
    ports:
      - "8081:80"
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
      MOODLE_DB_HOST: db
      MOODLE_DB_USER: postgres
      MOODLE_DB_PASSWORD: p@ssw0rd
      MOODLE_DB_NAME: moodle
      MOODLE_URL: http://localhost:8081
    volumes:
      - moodle_code:/var/www/html
      - moodle_data:/var/www/moodledata
      - ./moodle-config-file.php:/var/www/html/config.php
      - .:/var/www/html/public/search/engine/semantic:ro
    depends_on:
      db:
        condition: service_started
      moodle-init-code:
        condition: service_completed_successfully
    command: >
      sh -c "
      apt-get update && apt-get install -y poppler-utils &&
      if ! command -v composer >/dev/null 2>&1; then
        echo 'Composer not found. Installing Composer dynamically...' &&
        php -r \"copy('https://getcomposer.org/installer', 'composer-setup.php');\" &&
        php composer-setup.php --install-dir=/usr/local/bin --filename=composer &&
        php -r \"unlink('composer-setup.php');\";
      fi &&
      composer install --no-dev --classmap-authoritative --working-dir=/var/www/html &&
      apache2-foreground
      "
      
volumes:
  postgres_data:
  moodle_code:
  moodle_data:
