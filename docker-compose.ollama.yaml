services:
  ollama:
    image: ollama/ollama:latest
    container_name: moodle-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: moodle-ollama-pull-model
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: /bin/sh
    command: >
      -c "
      echo 'Waiting for Ollama API server to be online...' &&
      until ollama list >/dev/null 2>&1; do
        sleep 2
      done &&
      echo 'Ollama API is online. Pulling nomic-embed-text model...' &&
      ollama pull nomic-embed-text &&
      echo 'Model nomic-embed-text pulled successfully!'
      "
    depends_on:
      - ollama

volumes:
  ollama_data:
